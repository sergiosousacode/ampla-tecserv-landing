name: CI Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build da imagem Docker
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FACEBOOK="${{ vars.NEXT_PUBLIC_FACEBOOK }}" \
            --build-arg NEXT_PUBLIC_INSTAGRAM="${{ vars.NEXT_PUBLIC_INSTAGRAM }}" \
            --build-arg NEXT_PUBLIC_LINKEDIN="${{ vars.NEXT_PUBLIC_LINKEDIN }}" \
            --build-arg NEXT_PUBLIC_WHATSAPP="${{ vars.NEXT_PUBLIC_WHATSAPP }}" \
            --build-arg NEXT_PUBLIC_EMAIL="${{ vars.NEXT_PUBLIC_EMAIL }}" \
            -t ampla-tec-landing:latest .
