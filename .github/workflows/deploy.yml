name: Deploy Docker VM

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH (Docker)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/ampla-tecserv-landing
            git fetch --all
            git checkout main
            git pull origin main
            export NEXT_PUBLIC_FACEBOOK='${{ vars.NEXT_PUBLIC_FACEBOOK }}'
            export NEXT_PUBLIC_INSTAGRAM='${{ vars.NEXT_PUBLIC_INSTAGRAM }}'
            export NEXT_PUBLIC_LINKEDIN='${{ vars.NEXT_PUBLIC_LINKEDIN }}'
            export NEXT_PUBLIC_WHATSAPP='${{ vars.NEXT_PUBLIC_WHATSAPP }}'
            export NEXT_PUBLIC_EMAIL='${{ vars.NEXT_PUBLIC_EMAIL }}'
            docker compose down
            docker compose build --no-cache
            docker compose up -d --force-recreate
