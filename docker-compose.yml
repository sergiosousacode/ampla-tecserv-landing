services:
  web:
    container_name: ampla-landing
    image: ghcr.io/sergiosousacode/ampla-tecserv-landing:latest

    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - webnet

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
