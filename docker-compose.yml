version: "3.9"

services:
  web:
    container_name: ampla-landing
    image: ampla-tec-landing
    build: .
    env_file: .env
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - webnet

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
