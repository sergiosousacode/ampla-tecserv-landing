services:
  db:
    image: postgres:16-alpine
    container_name: ampla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ampla_portal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webnet

  web:
    container_name: ampla-landing
    image: ampla-tec-landing

    env_file:
      - .env

    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FACEBOOK: ${NEXT_PUBLIC_FACEBOOK:-}
        NEXT_PUBLIC_INSTAGRAM: ${NEXT_PUBLIC_INSTAGRAM:-}
        NEXT_PUBLIC_LINKEDIN: ${NEXT_PUBLIC_LINKEDIN:-}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_FACEBOOK: ${NEXT_PUBLIC_FACEBOOK:-}
      NEXT_PUBLIC_INSTAGRAM: ${NEXT_PUBLIC_INSTAGRAM:-}
      NEXT_PUBLIC_LINKEDIN: ${NEXT_PUBLIC_LINKEDIN:-}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
      NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ampla_portal}?schema=public
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:-}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}

    expose:
      - "3000"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - webnet

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  postgres_data:
