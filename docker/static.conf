# Servidor estático interno do institucional; não substitui o proxy TLS.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
